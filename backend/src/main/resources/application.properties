spring.application.name=crm

# Segredos chegam como arquivos (Compose secrets). O nome do arquivo é a propriedade:
#   /run/secrets/spring.datasource.password e /run/secrets/crm.sidecar-segredo
spring.config.import=optional:configtree:/run/secrets/

# Sem valor padrão: a aplicação não sobe sem prazo de retenção nem segredo do sidecar.
crm.retencao-dias=${CRM_RETENCAO_DIAS}
crm.midia-dir=${CRM_MIDIA_DIR:/dados/midia}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB

management.endpoints.web.exposure.include=health
